; ESP32-S3 N16R8 environmental measurement station
; Settings match what we tuned today via the Arduino IDE Tools menu:
;   - Flash Size 16MB (original bug: partition table assumed 16MB while
;     flash size was set to 4MB -> "partition invalid - offset exceeds flash size")
;   - PSRAM OPI (N16R8 has 8MB OPI PSRAM, not QSPI)
;   - USB CDC On Boot enabled (without it Serial.print() doesn't go out over
;     USB at all, even though the code keeps running)

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600
; if upload fails (e.g. through a USB hub), try lowering this to 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; esp32-s3-devkitc-1.json has no BOARD_HAS_PSRAM in extra_flags, and
    ; board_build.psram_type/memory_type don't set it automatically ->
    ; without this flag esp32-hal-psram.h explicitly #undef's
    ; CONFIG_SPIRAM/CONFIG_SPIRAM_SUPPORT and PSRAM won't be used at
    ; runtime, even though the build succeeds.
    -DBOARD_HAS_PSRAM

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
; verified: default_16MB.csv exists in framework-arduinoespressif32/partitions
board_build.partitions = default_16MB.csv

; board_build.flash_size above only affects the BUILD (sdkconfig, partition
; offsets). esp32-s3-devkitc-1.json has a SEPARATE upload.flash_size=8MB
; (N8 default), which otherwise gets sent to esptool during upload as
; --flash_size 8MB -> the bootloader gets 8MB baked into its header, while
; the partition table and the real chip both expect 16MB -> boot loop right
; in the ROM bootloader (no 2nd stage messages, tight rst:0x3
; RTC_SW_SYS_RST loop).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
    boschsensortec/bsec2@^1.10.2610
    boschsensortec/BME68x Sensor library@^1.3.40408
    starmbi/hp_BH1750 @ ^1.0.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    tzapu/WiFiManager @ ^2.0.17
    adafruit/Adafruit NeoPixel @ ^1.12.3

; bsec2 also needs boschsensortec/BME68x Sensor library (bme68xLibrary.h) —
; BSEC2 is just the fusion algorithm, the low-level sensor driver is a
; separate package.
